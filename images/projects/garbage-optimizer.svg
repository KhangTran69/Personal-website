<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Route optimization map preview">
  <rect width="800" height="500" fill="#0b1322"/>

  <!-- street grid -->
  <g stroke="#16233c" stroke-width="2">
    <line x1="60" y1="80" x2="60" y2="470"/>
    <line x1="170" y1="40" x2="170" y2="470"/>
    <line x1="280" y1="60" x2="280" y2="470"/>
    <line x1="390" y1="30" x2="390" y2="470"/>
    <line x1="500" y1="70" x2="500" y2="470"/>
    <line x1="610" y1="40" x2="610" y2="470"/>
    <line x1="720" y1="90" x2="720" y2="470"/>
    <line x1="30" y1="140" x2="770" y2="140"/>
    <line x1="30" y1="250" x2="770" y2="250"/>
    <line x1="30" y1="360" x2="770" y2="360"/>
    <line x1="120" y1="30" x2="40" y2="470"/>
    <line x1="760" y1="50" x2="560" y2="470"/>
  </g>
  <g fill="#101c33">
    <rect x="200" y="160" width="60" height="50" rx="4"/>
    <rect x="430" y="280" width="52" height="44" rx="4"/>
    <rect x="640" y="170" width="58" height="40" rx="4"/>
    <rect x="320" y="380" width="48" height="46" rx="4"/>
    <rect x="80" y="180" width="56" height="42" rx="4"/>
  </g>

  <!-- routes -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <polyline points="90,390 200,330 290,365 380,295 470,330 545,265" stroke="#34d399"/>
    <polyline points="90,390 180,225 300,185 430,150 545,185 640,120" stroke="#38bdf8"/>
    <polyline points="90,390 260,415 400,425 520,370 645,400" stroke="#fbbf24"/>
  </g>

  <!-- depot -->
  <rect x="76" y="376" width="28" height="28" rx="6" fill="#e6edf6"/>
  <rect x="83" y="383" width="14" height="14" rx="3" fill="#0b1322"/>

  <!-- route nodes -->
  <g font-family="Roboto Mono, ui-monospace, Menlo, monospace" font-size="11" text-anchor="middle" font-weight="500">
    <g fill="#0b1322" stroke-width="3">
      <circle cx="200" cy="330" r="10" stroke="#34d399"/><circle cx="290" cy="365" r="10" stroke="#34d399"/><circle cx="380" cy="295" r="10" stroke="#34d399"/><circle cx="470" cy="330" r="10" stroke="#34d399"/>
      <circle cx="180" cy="225" r="10" stroke="#38bdf8"/><circle cx="300" cy="185" r="10" stroke="#38bdf8"/><circle cx="430" cy="150" r="10" stroke="#38bdf8"/><circle cx="545" cy="185" r="10" stroke="#38bdf8"/>
      <circle cx="260" cy="415" r="10" stroke="#fbbf24"/><circle cx="400" cy="425" r="10" stroke="#fbbf24"/><circle cx="520" cy="370" r="10" stroke="#fbbf24"/><circle cx="645" cy="400" r="10" stroke="#fbbf24"/>
    </g>
  </g>

  <!-- header chip -->
  <g>
    <rect x="28" y="24" width="326" height="30" rx="15" fill="#0c1322" stroke="#1c2841"/>
    <circle cx="46" cy="39" r="4" fill="#34d399"/>
    <text x="58" y="43" font-family="Roboto Mono, ui-monospace, Menlo, monospace" font-size="12" fill="#9aa7bd">Concept preview · not an app capture</text>
  </g>

  <!-- legend -->
  <g font-family="Roboto Mono, ui-monospace, Menlo, monospace" font-size="11" fill="#9aa7bd">
    <rect x="28" y="452" width="196" height="30" rx="15" fill="#0c1322" stroke="#1c2841"/>
    <circle cx="46" cy="467" r="4" fill="#34d399"/><text x="56" y="471">Truck 1</text>
    <circle cx="122" cy="467" r="4" fill="#38bdf8"/><text x="132" y="471">Truck 2</text>
    <circle cx="198" cy="467" r="4" fill="#fbbf24"/>
  </g>

  <!-- GA convergence mini chart -->
  <g>
    <rect x="598" y="272" width="176" height="122" rx="10" fill="#0c1322" stroke="#1c2841"/>
    <text x="614" y="298" font-family="Roboto Mono, ui-monospace, Menlo, monospace" font-size="11" fill="#9aa7bd">GA convergence</text>
    <polyline points="614,378 644,352 674,340 704,328 734,322 758,318" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="614" y1="382" x2="758" y2="382" stroke="#1c2841" stroke-width="1.5"/>
    <circle cx="758" cy="318" r="4" fill="#34d399"/>
    <text x="614" y="336" font-family="Roboto Mono, ui-monospace, Menlo, monospace" font-size="9" fill="#5b6a83">best distance</text>
  </g>

  <!-- live metrics chip -->
  <g>
    <rect x="598" y="414" width="176" height="58" rx="10" fill="#0c1322" stroke="#1c2841"/>
    <text x="614" y="437" font-family="Roboto Mono, ui-monospace, Menlo, monospace" font-size="11" fill="#e6edf6">fuel · cost · CO₂</text>
    <text x="614" y="457" font-family="Roboto Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#5b6a83">sample metric labels</text>
  </g>
</svg>
